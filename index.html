<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080910" />
    <meta
      name="description"
      content="Connect with Louis on Facebook and Instagram."
    />
    <title>Louis · Social Links</title>
    <style>
      :root {
        --bg: #080910;
        --panel: rgba(16, 17, 29, 0.8);
        --line: rgba(255, 255, 255, 0.13);
        --muted: #9a9bab;
        --text: #f8f8ff;
        --cyan: #53f5ff;
        --pink: #ff4fd8;
        --purple: #8e5cff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 10% 8%, rgba(142, 92, 255, 0.22), transparent 27rem),
          radial-gradient(circle at 90% 10%, rgba(255, 79, 216, 0.15), transparent 24rem),
          radial-gradient(circle at 50% 100%, rgba(83, 245, 255, 0.11), transparent 30rem),
          var(--bg);
      }

      body::before,
      body::after {
        position: fixed;
        z-index: -1;
        width: 30rem;
        height: 30rem;
        border-radius: 50%;
        content: "";
        filter: blur(75px);
        opacity: 0.12;
        pointer-events: none;
      }

      body::before {
        top: 28%;
        left: -18rem;
        background: var(--cyan);
      }

      body::after {
        right: -18rem;
        bottom: 6%;
        background: var(--pink);
      }

      .shell {
        width: min(100% - 32px, 620px);
        margin: 0 auto;
        padding: 28px 0 30px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .live {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .live::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #c2ff65;
        box-shadow: 0 0 12px #c2ff65;
        content: "";
      }

      .signal {
        position: relative;
        width: 58px;
        height: 28px;
        overflow: hidden;
        border: 1px solid rgba(83, 245, 255, 0.18);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
      }

      .signal::before {
        position: absolute;
        top: 50%;
        left: 12px;
        width: 4px;
        height: 7px;
        border-radius: 2px;
        background: var(--cyan);
        box-shadow: 8px 0 0 var(--purple), 16px 0 0 var(--pink),
          24px 0 0 var(--cyan), 32px 0 0 var(--purple);
        content: "";
        transform: translateY(-50%);
      }

      .card {
        position: relative;
        overflow: hidden;
        padding: clamp(30px, 7vw, 58px) clamp(20px, 6vw, 54px) 25px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 30px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.06), transparent 30%),
          var(--panel);
        box-shadow:
          0 30px 100px rgba(0, 0, 0, 0.38),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
      }

      .card::before {
        position: absolute;
        top: -180px;
        left: -15%;
        width: 130%;
        height: 235px;
        border-radius: 50%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(83, 245, 255, 0.15),
          rgba(255, 79, 216, 0.17),
          transparent
        );
        content: "";
        filter: blur(24px);
        transform: rotate(-7deg);
      }

      .profile {
        position: relative;
        z-index: 1;
        text-align: center;
      }

      .avatar {
        position: relative;
        display: grid;
        width: 98px;
        height: 98px;
        margin: 0 auto 21px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 50%;
        background: linear-gradient(140deg, var(--cyan), var(--purple) 52%, var(--pink));
        box-shadow:
          0 0 0 7px rgba(83, 245, 255, 0.09),
          0 0 35px rgba(83, 245, 255, 0.38),
          0 0 62px rgba(255, 79, 216, 0.22);
      }

      .avatar::before {
        position: absolute;
        inset: 6px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: inherit;
        content: "";
      }

      .avatar span {
        position: relative;
        font-size: 1.7rem;
        font-weight: 950;
        letter-spacing: -0.1em;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--cyan);
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.3rem, 8vw, 4rem);
        font-weight: 950;
        letter-spacing: -0.07em;
        line-height: 0.95;
      }

      h1 span {
        display: block;
        color: transparent;
        background: linear-gradient(95deg, var(--cyan), #fff 44%, var(--pink));
        background-clip: text;
        -webkit-background-clip: text;
      }

      .bio {
        max-width: 390px;
        margin: 17px auto 0;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.65;
      }

      .links {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 13px;
        margin-top: 34px;
      }

      .link-button {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 70px;
        padding: 11px 16px 11px 12px;
        color: var(--text);
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.045);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        transition:
          transform 180ms ease,
          background 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease;
      }

      .link-button:hover,
      .link-button:focus-visible {
        border-color: rgba(83, 245, 255, 0.58);
        background: rgba(83, 245, 255, 0.1);
        box-shadow:
          0 12px 30px rgba(0, 0, 0, 0.25),
          0 0 30px rgba(83, 245, 255, 0.12);
        outline: none;
        transform: translateY(-3px);
      }

      .icon {
        display: grid;
        width: 46px;
        height: 46px;
        flex: 0 0 46px;
        place-items: center;
        border-radius: 14px;
      }

      .icon.facebook {
        background: linear-gradient(140deg, #58a8ff, #1877f2);
        box-shadow: 0 0 20px rgba(24, 119, 242, 0.34);
      }

      .icon.instagram {
        background: linear-gradient(140deg, #ffd36b, #ff4f9a 47%, #8e5cff);
        box-shadow: 0 0 20px rgba(255, 79, 216, 0.3);
      }

      .icon svg {
        width: 24px;
        height: 24px;
        fill: white;
      }

      .copy {
        display: grid;
        gap: 3px;
        min-width: 0;
        text-align: left;
      }

      .copy strong {
        font-size: 1rem;
        font-weight: 850;
      }

      .copy span {
        overflow: hidden;
        color: var(--muted);
        font-size: 0.82rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .arrow {
        margin-left: auto;
        color: var(--muted);
        font-size: 1.35rem;
      }

      .note {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin: 25px 0 0;
        color: var(--muted);
        font-size: 0.74rem;
      }

      .note::before {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--pink);
        box-shadow: 0 0 10px var(--pink);
        content: "";
      }

      footer {
        padding-top: 18px;
        color: rgba(154, 155, 171, 0.64);
        font-size: 0.7rem;
        text-align: center;
      }

      @media (max-width: 480px) {
        .shell {
          width: min(100% - 20px, 620px);
          padding-top: 16px;
        }

        .card {
          border-radius: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="topbar">
        <span class="live">Available online</span>
        <span class="signal" aria-label="Signal active"></span>
      </div>

      <section class="card" aria-labelledby="profile-name">
        <div class="profile">
          <div class="avatar" aria-hidden="true"><span>LM</span></div>
          <p class="eyebrow">Connect with me</p>
          <h1 id="profile-name">Louis <span>Online.</span></h1>
          <p class="bio">
            One place for updates, conversations, and everything I’m sharing next.
          </p>
        </div>

        <nav class="links" aria-label="Social links">
          <a
            class="link-button"
            href="https://www.facebook.com/louis.batucan2006"
            target="_blank"
            rel="noreferrer"
          >
            <span class="icon facebook" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.5-1.5h1.7V4a22 22 0 0 0-2.5-.1c-2.5 0-4.2 1.5-4.2 4.3V10H7.5v3H10v8h3.5Z"></path>
              </svg>
            </span>
            <span class="copy">
              <strong>Facebook</strong>
              <span>louis.batucan2006</span>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>

          <a
            class="link-button"
            href="https://www.instagram.com/mar_louis_13"
            target="_blank"
            rel="noreferrer"
          >
            <span class="icon instagram" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                <circle cx="12" cy="12" r="4"></circle>
                <circle cx="17.5" cy="6.5" r="1" fill="white" stroke="none"></circle>
              </svg>
            </span>
            <span class="copy">
              <strong>Instagram</strong>
              <span>@mar_louis_13</span>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </nav>

        <p class="note">Tap a button to connect</p>
      </section>

      <footer>Built for your next connection · 2026</footer>
    </main>
  </body>
</html>
